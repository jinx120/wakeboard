<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[2345]..", "swap": true}]}'>
<title>{% block title %}Wakeboard{% endblock %} - Wakeboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
<header class="top">
  <a class="brand" href="/">Wakeboard</a>
  {% if authed %}
  <nav>
    <a href="/">Devices</a>
    <a href="/devices/new">Add</a>
    <a href="/audit">Audit</a>
    <a href="/settings">Settings</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Log out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  <div id="result" aria-live="polite"></div>
  {% block content %}{% endblock %}
</main>
</body>
</html>
