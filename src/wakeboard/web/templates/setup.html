{% extends "base.html" %}
{% block title %}First-run setup{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Set a password</h1>
  <p>This is the first run. Choose the password for the Wakeboard web UI (at least 8 characters).</p>
  {% if error %}<p class="msg bad">{{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
    </label>
    <label>Repeat password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit" class="primary">Save and log in</button>
  </form>
</section>
{% endblock %}
