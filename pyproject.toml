[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wakeboard"
version = "0.1.0"
description = "Power controller for homelab machines"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "asyncssh",
  "jinja2",
  "argon2-cffi",
  "itsdangerous",
  "mcp>=2.3,<3",
  "python-multipart",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wakeboard = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
