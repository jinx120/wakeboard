services:
  wakeboard:
    # `docker compose pull && docker compose up -d` uses the published image;
    # `docker compose up -d --build` builds it from this repo instead.
    image: ghcr.io/jinx120/wakeboard:latest
    build: .
    container_name: wakeboard
    restart: unless-stopped
    # Host networking: Wake-on-LAN broadcasts and ping must reach the LAN directly.
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      # Initial web UI password; applied only on first start (when none is set yet).
      WAKEBOARD_PASSWORD: ${WAKEBOARD_PASSWORD:-}
      WAKEBOARD_PORT: ${WAKEBOARD_PORT:-8080}
